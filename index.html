<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Balcon EC2</title>

  <!-- Réglages pour que l'app se comporte comme une vraie app sur iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Balcon EC2">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    /* ===== Couleurs (clair / sombre automatique selon le réglage de l'iPhone) ===== */
    :root {
      --fond: #f2f3f7;
      --carte: #ffffff;
      --texte: #16181d;
      --doux: #667085;
      --ligne: #e6e8ee;
      --champ: #f3f4f8;
      --accent: #2563eb;
      --accent-doux: #e8efff;
      --ok: #15803d;
      --ok-fond: #e4f5ea;
      --ko: #c92a2a;
      --ko-fond: #fdeaea;
      --alerte: #8a5a00;
      --alerte-fond: #fff3d1;
      --ombre: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .05);
      /* dessin de la coupe */
      --beton: #dfe3ea;
      --hachure: #8b93a3;
      --trait: #1f2430;
      --cote: #1d5fd0;
      --cote-fond: #cfdcf6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #0c0e12;
        --carte: #181b21;
        --texte: #eceff4;
        --doux: #9aa3b2;
        --ligne: #2a2f38;
        --champ: #22262e;
        --accent: #6b9bff;
        --accent-doux: #1e2a45;
        --ok: #5fd08a;
        --ok-fond: #14301f;
        --ko: #ff8a8a;
        --ko-fond: #3a1a1a;
        --alerte: #f2c76a;
        --alerte-fond: #3a2f10;
        --ombre: none;
        --beton: #2b303a;
        --hachure: #6b7385;
        --trait: #e8ebf2;
        --cote: #7fb0ff;
        --cote-fond: #24365c;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.35;
      padding: calc(12px + env(safe-area-inset-top)) 14px calc(104px + env(safe-area-inset-bottom));
    }
    main { max-width: 560px; margin: 0 auto; }

    /* ===== En-tête ===== */
    .entete { padding: 8px 4px 16px; }
    .entete h1 { font-size: 32px; letter-spacing: -.02em; margin: 0; }
    .entete p { margin: 2px 0 0; color: var(--doux); font-size: 15px; }

    /* ===== Cartes ===== */
    .carte {
      background: var(--carte);
      border-radius: 18px;
      box-shadow: var(--ombre);
      padding: 16px 16px 8px;
      margin-bottom: 14px;
    }
    .carte h2 {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; margin: 0 0 8px; letter-spacing: -.01em;
    }
    .pastille {
      display: inline-grid; place-items: center;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent-doux); color: var(--accent);
      font-size: 14px; font-weight: 700;
    }

    /* ===== Lignes de saisie ===== */
    .champ-bloc { border-top: 1px solid var(--ligne); }
    .carte h2 + .champ-bloc, .coupe + .champ-bloc { border-top: 0; }
    .champ {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 0;
    }
    .intitule { flex: 1; min-width: 0; font-size: 15px; }
    .symb {
      display: inline-block; min-width: 2.1em; margin-right: 6px; padding: 1px 6px;
      border-radius: 6px; background: var(--champ); color: var(--doux);
      font-size: 13px; font-weight: 600; text-align: center;
    }
    .saisie { display: flex; align-items: center; gap: 6px; flex: none; }
    .saisie input {
      width: 92px;
      font: inherit; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
      text-align: right;
      padding: 9px 10px;
      border: 1.5px solid transparent;
      border-radius: 10px;
      background: var(--champ);
      color: var(--texte);
      -webkit-appearance: none; appearance: none;
    }
    .saisie input:focus { outline: none; border-color: var(--accent); background: var(--carte); }
    .unite { width: 3.4em; font-size: 13px; color: var(--doux); }
    .champ-bloc.invalide input { border-color: var(--ko); background: var(--ko-fond); }
    .msg-champ { display: none; margin: -4px 0 8px; font-size: 13px; color: var(--ko); }
    .champ-bloc.invalide .msg-champ { display: block; }

    /* Case à cocher « présence d'un acrotère » */
    .case { width: 26px; height: 26px; flex: none; accent-color: var(--accent); margin: 0; }
    /* Champs grisés (acrotère décoché) */
    .champ-bloc.desactive .champ { opacity: .45; }
    .saisie input:disabled {
      opacity: 1; cursor: not-allowed;
      -webkit-text-fill-color: var(--doux); color: var(--doux);
    }

    /* ===== Sélecteurs ===== */
    .segment {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--champ); border-radius: 12px; padding: 4px; margin: 6px 0 12px;
    }
    .segment input { position: absolute; opacity: 0; pointer-events: none; }
    .segment span {
      display: block; text-align: center; padding: 9px 0; border-radius: 9px;
      font-weight: 600; color: var(--doux);
    }
    .segment input:checked + span { background: var(--carte); color: var(--texte); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
    .segment input:focus-visible + span { outline: 2px solid var(--accent); }
    .sous-titre { font-size: 14px; color: var(--doux); margin: 10px 0 0; }
    select {
      width: 100%; margin: 6px 0 4px;
      font: inherit; font-size: 16px;
      padding: 12px 38px 12px 12px;
      border: 1.5px solid transparent; border-radius: 12px;
      background-color: var(--champ); color: var(--texte);
      -webkit-appearance: none; appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--doux) 50%), linear-gradient(135deg, var(--doux) 50%, transparent 50%);
      background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
      background-size: 6px 6px; background-repeat: no-repeat;
    }
    select:focus { outline: none; border-color: var(--accent); }
    .psi { font-size: 13px; color: var(--doux); margin: 0 0 12px; }

    /* ===== Vue en coupe ===== */
    .coupe {
      margin: 0 -4px 6px; padding: 4px 4px 12px;
      border-bottom: 1px solid var(--ligne);
    }
    #coupe-svg { width: 100%; line-height: 0; }
    #coupe-svg svg { display: block; max-width: 100%; height: auto; }
    .c-beton { fill: var(--beton); }
    .c-hachure { stroke: var(--hachure); stroke-width: 1; opacity: .45; }
    .c-trait { fill: none; stroke: var(--trait); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .c-coupure { fill: none; stroke: var(--doux); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .cote line { stroke: var(--cote); stroke-width: 1.2; }
    .cote polygon { fill: var(--cote); }
    .c-nom { fill: var(--cote); font-weight: 600; }
    .c-boite { fill: var(--cote-fond); }
    .c-val { fill: var(--texte); }
    .cote.actif line { stroke-width: 2.4; }
    .cote.actif .c-boite { fill: var(--cote); }
    .cote.actif .c-val { fill: #fff; }
    .actions-coupe { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .btn-secondaire {
      font: inherit; font-size: 15px; font-weight: 600;
      padding: 10px 14px; border: 0; border-radius: 12px;
      background: var(--accent-doux); color: var(--accent);
    }
    .btn-secondaire:active { opacity: .7; }
    .aide { font-size: 13px; color: var(--doux); margin: 0; flex: 1; min-width: 160px; }
    .aide.erreur { color: var(--ko); }

    /* ===== Résultats ===== */
    #resultats { scroll-margin-top: 12px; padding-bottom: 16px; }
    .message { border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
    .message.erreur { background: var(--ko-fond); color: var(--ko); }
    .message.alerte { background: var(--alerte-fond); color: var(--alerte); }
    .message ul { margin: 4px 0 0; padding-left: 18px; }
    .groupe { margin-top: 14px; }
    .groupe h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); margin: 0 0 4px; }
    .ligne-res { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 15px; }
    .ligne-res .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .jauge { margin-top: 6px; }
    .jauge-tete { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--doux); }
    .jauge-tete .grand { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .piste { height: 10px; border-radius: 6px; background: var(--champ); overflow: hidden; margin-top: 6px; }
    .remplissage { height: 100%; border-radius: 6px; transition: width .25s ease; }
    .ok .grand { color: var(--ok); } .ok .remplissage { background: var(--ok); }
    .ko .grand { color: var(--ko); } .ko .remplissage { background: var(--ko); }
    /* ===== Résultats intermédiaires ===== */
    details.carte { padding-bottom: 10px; }
    details.carte > summary {
      display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none;
      font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 4px;
    }
    details.carte > summary::-webkit-details-marker { display: none; }
    details.carte > summary::after { content: "▾"; margin-left: auto; color: var(--doux); transition: transform .2s; }
    details.carte:not([open]) > summary::after { transform: rotate(-90deg); }
    .ligne-inter {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      padding: 7px 0; border-top: 1px solid var(--ligne);
    }
    .groupe h3 + .ligne-inter { border-top: 0; }
    .li-nom { display: block; font-size: 15px; }
    .li-formule { display: block; font-size: 12.5px; color: var(--doux); }
    .li-val { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .li-val small { font-weight: 400; color: var(--doux); font-size: 13px; }
    .aide-inter { font-size: 14px; color: var(--doux); margin: 8px 0; }
    .note { font-size: 12px; color: var(--doux); text-align: center; margin: 4px 12px 0; }

    /* ===== Barre de résumé fixe en bas ===== */
    .barre {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; gap: 10px; justify-content: center;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--carte) 86%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-top: 1px solid var(--ligne);
    }
    .barre-contenu { display: flex; gap: 10px; width: 100%; max-width: 560px; }
    .pilule {
      flex: 1; display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border: 0; border-radius: 14px;
      background: var(--champ); color: var(--doux);
      font: inherit; font-size: 14px; font-weight: 600;
    }
    .pilule .p-val { font-size: 18px; font-variant-numeric: tabular-nums; }
    .pilule.ok { background: var(--ok-fond); color: var(--ok); }
    .pilule.ko { background: var(--ko-fond); color: var(--ko); }
  </style>
</head>
<body>
<main>
  <header class="entete">
    <h1>Balcon EC2</h1>
    <p>Balcon en console · flexion (ELU) et flèche (ELS)</p>
  </header>

  <form id="formulaire" novalidate autocomplete="off"></form>

  <section class="carte" id="resultats" aria-live="polite"></section>

  <details class="carte" id="inter">
    <summary>Résultats intermédiaires</summary>
    <div id="inter-contenu"></div>
  </details>
  <p class="note">Outil d’aide au calcul : à vérifier avant toute utilisation sur un projet.</p>
</main>

<!-- Résumé toujours visible : touche pour aller aux détails -->
<div class="barre">
  <div class="barre-contenu">
    <button type="button" class="pilule" id="pil-acier"><span>Aciers</span><span class="p-val">—</span></button>
    <button type="button" class="pilule" id="pil-fleche"><span>Flèche</span><span class="p-val">—</span></button>
  </div>
</div>

<script src="calcul.js"></script>
<script src="champs.js"></script>
<script src="coupe.js"></script>
<script src="dxf.js"></script>
<script>
  const CLES_GEOMETRIE = ["A", "Ha", "L", "B", "Hb"];
  const champsParCle = {};
  SECTIONS.forEach((s) => s.champs.forEach((c) => (champsParCle[c.cle] = c)));

  const formulaire = document.getElementById("formulaire");
  const zoneResultats = document.getElementById("resultats");

  const virgule = (x) => String(x).replace(".", ",");
  const formater = (x, decimales = 2) => x.toFixed(decimales).replace(".", ",");

  // ---------- Construction du formulaire ----------
  function htmlChamp(c) {
    return `
      <div class="champ-bloc" data-cle="${c.cle}">
        <label class="champ" for="f-${c.cle}">
          <span class="intitule"><span class="symb">${c.symbole}</span>${c.libelle}</span>
          <span class="saisie">
            <input id="f-${c.cle}" data-cle="${c.cle}" type="text" inputmode="decimal"
                   enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false">
            <span class="unite">${c.unite}</span>
          </span>
        </label>
        <div class="msg-champ"></div>
      </div>`;
  }

  const blocCoupe = `
    <div class="coupe">
      <div id="coupe-svg"></div>
      <div class="actions-coupe">
        <button type="button" class="btn-secondaire" id="btn-dxf">Exporter la coupe (DXF)</button>
        <p class="aide" id="aide-export">S’ouvre dans AutoCAD : Enregistrer sous… pour obtenir un DWG.</p>
      </div>
    </div>`;

  const blocAcrotere = `
    <div class="champ-bloc">
      <label class="champ" for="acrotere">
        <span class="intitule">Présence d’un acrotère béton ?</span>
        <input class="case" id="acrotere" type="checkbox" checked>
      </label>
    </div>`;

  let html = "";
  SECTIONS.forEach((s, i) => {
    html += `<section class="carte"><h2><span class="pastille">${i + 1}</span>${s.titre}</h2>`;
    if (s.id === "geom") html += blocCoupe + blocAcrotere;
    html += s.champs.map(htmlChamp).join("") + `</section>`;
  });

  html += `
    <section class="carte">
      <h2><span class="pastille">${SECTIONS.length + 1}</span>Flèche et exploitation</h2>
      <p class="sous-titre" style="margin-top:0">Limite de flèche</p>
      <div class="segment" role="radiogroup" aria-label="Limite de flèche">
        <label><input type="radio" name="limite" value="250" checked><span>L / 250</span></label>
        <label><input type="radio" name="limite" value="500"><span>L / 500</span></label>
      </div>
      <p class="sous-titre" style="margin-top:0">Type d’exploitation principal</p>
      <select id="type_exploitation" aria-label="Type d’exploitation principal"></select>
      <p class="psi" id="psi"></p>
    </section>`;
  formulaire.innerHTML = html;

  const selectType = document.getElementById("type_exploitation");
  Object.keys(PSI2_VALUES).forEach((nom) => {
    const option = document.createElement("option");
    option.value = nom;
    option.textContent = nom;
    selectType.appendChild(option);
  });

  // Valeurs par défaut (DEFAULTS est en m et kN : on les convertit en cm et daN pour l'affichage)
  Object.keys(champsParCle).forEach((cle) => {
    document.getElementById("f-" + cle).value = virgule(versAffichage(champsParCle[cle], DEFAULTS[cle]));
  });

  // ---------- Case « Présence d'un acrotère béton ? » ----------
  const caseAcrotere = document.getElementById("acrotere");
  // Mémorise B et Hb : si on recoche la case, on retrouve les valeurs d'avant
  const memoireAcrotere = {
    B: document.getElementById("f-B").value,
    Hb: document.getElementById("f-Hb").value,
  };

  function appliquerAcrotere() {
    const coche = caseAcrotere.checked;
    Object.values(champsParCle).filter((c) => c.dependAcrotere).forEach((champ) => {
      const input = document.getElementById("f-" + champ.cle);
      if (!coche) {
        const v = lireNombre(input.value);
        if (verifierChamp(champ, v) === null) memoireAcrotere[champ.cle] = input.value;
        input.value = "0";
      } else {
        input.value = memoireAcrotere[champ.cle];
      }
      input.disabled = !coche;
      input.closest(".champ-bloc").classList.toggle("desactive", !coche);
    });
  }
  caseAcrotere.addEventListener("change", appliquerAcrotere);

  // ---------- Vue en coupe ----------
  const derniereGeometrie = {}; // en mètres
  CLES_GEOMETRIE.forEach((cle) => (derniereGeometrie[cle] = DEFAULTS[cle]));
  let champActif = null;

  // Retourne la géométrie à dessiner (en mètres) : si un champ est vide ou invalide, on garde sa dernière valeur correcte
  function lireGeometrie() {
    let toutValide = true;
    CLES_GEOMETRIE.forEach((cle) => {
      const champ = champsParCle[cle];
      const v = lireNombre(document.getElementById("f-" + cle).value);
      if (verifierChamp(champ, v) === null) derniereGeometrie[cle] = versSI(champ, v);
      else toutValide = false;
    });
    return { g: { ...derniereGeometrie }, toutValide };
  }

  function redessinerCoupe() {
    const conteneur = document.getElementById("coupe-svg");
    const largeur = conteneur.clientWidth;
    if (largeur < 50) return; // pas encore affiché
    conteneur.innerHTML = dessinerCoupeSVG(lireGeometrie().g, largeur, champActif).svg;
  }
  new ResizeObserver(redessinerCoupe).observe(document.getElementById("coupe-svg"));

  // ---------- Export DXF ----------
  const aideExport = document.getElementById("aide-export");
  const texteAideInitial = aideExport.textContent;

  function messageExport(texte, erreur) {
    aideExport.textContent = texte;
    aideExport.classList.toggle("erreur", !!erreur);
  }

  document.getElementById("btn-dxf").addEventListener("click", async () => {
    const { g, toutValide } = lireGeometrie();
    if (!toutValide) {
      messageExport("Corrigez d’abord les champs de géométrie en rouge.", true);
      return;
    }
    const nomFichier = "coupe-balcon.dxf";
    const contenu = genererDXF(g);
    try {
      // Sur téléphone : feuille de partage (« Enregistrer dans Fichiers », AirDrop, mail…)
      const fichier = new File([contenu], nomFichier, { type: "application/dxf" });
      const tactile = window.matchMedia("(pointer: coarse)").matches;
      if (tactile && navigator.canShare && navigator.canShare({ files: [fichier] })) {
        await navigator.share({ files: [fichier], title: "Coupe de balcon" });
        messageExport("Fichier " + nomFichier + " partagé.", false);
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return; // l'utilisateur a fermé la feuille de partage
      // autre erreur : on tente le téléchargement classique ci-dessous
    }
    const blob = new Blob([contenu], { type: "application/octet-stream" });
    const lien = document.createElement("a");
    lien.href = URL.createObjectURL(blob);
    lien.download = nomFichier;
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    setTimeout(() => URL.revokeObjectURL(lien.href), 10000);
    messageExport("Fichier " + nomFichier + " téléchargé.", false);
  });

  // ---------- Calcul en direct ----------
  function jauge(titre, taux) {
    const etat = taux <= 100 ? "ok" : "ko";
    const largeur = Math.max(0, Math.min(taux, 100));
    return `
      <div class="jauge ${etat}">
        <div class="jauge-tete"><span>${titre}</span><span class="grand">${formater(taux, 1)} %</span></div>
        <div class="piste"><div class="remplissage" style="width:${largeur}%"></div></div>
      </div>`;
  }

  function majPilule(id, valeur) {
    const pilule = document.getElementById(id);
    pilule.className = "pilule" + (valeur === null ? "" : valeur <= 100 ? " ok" : " ko");
    pilule.querySelector(".p-val").textContent = valeur === null ? "—" : formater(valeur, 1) + " %";
  }

  // ---------- Résultats intermédiaires ----------
  // Le calcul travaille en m et kN ; on affiche en cm et daN, comme les données saisies.
  const nf = (x, d) => x.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });

  function afficherIntermediaires(r, donnees) {
    const cible = document.getElementById("inter-contenu");
    if (!r) {
      cible.innerHTML = `<p class="aide-inter">Disponibles dès que les données sont valides.</p>`;
      return;
    }
    // chaque ligne : [nom, formule, valeur déjà formatée, unité]
    const groupes = [
      ["Matériaux et section", [
        ["Résistance de calcul de l’acier fyd", "fyk / 1,15", nf(r.fyd, 1), "MPa"],
        ["Résistance de calcul du béton fcd", "fck / 1,5", nf(r.fcd, 2), "MPa"],
        ["Hauteur utile d", "Ha − e − ⌀/2", nf(r.d * 100, 2), "cm"],
        ["Portée de calcul Lu", "L + min(Ha/2 ; a/2)", nf(r.L_utile * 100, 1), "cm"],
      ]],
      ["Charges à l’ELU", [
        ["Poids propre de la dalle", "25 × Ha", nf(r.Gdalle * 100, 0), "daN/m²"],
        ["Charge permanente totale G", "poids propre + charge permanente", nf(r.Gtot * 100, 0), "daN/m²"],
        ["Charge sur la dalle Pelu", "1,35 G + 1,5 Q", nf(r.Pelu * 100, 0), "daN/ml"],
        ["Charge de l’acrotère et du garde-corps Pacro", "1,35 (Hb · B · 25 + PGC)", nf(r.Pacro * 100, 1), "daN/ml"],
      ]],
      ["Moments à l’ELU (par mètre de balcon)", [
        ["Moment dû aux charges réparties", "Pelu · Lu² / 2", nf(r.Moment_one * 100, 0), "daN.m"],
        ["Moment dû à l’acrotère et au garde-corps", "Pacro · (Lu − B/2)", nf(r.Moment_two * 100, 0), "daN.m"],
        ["Moment dû à la poussée sur l’acrotère", "valeur saisie", nf(donnees.Ma * 100, 0), "daN.m"],
        ["Moment total MEd", "somme des trois moments", nf(r.Moment_tot * 100, 0), "daN.m"],
      ]],
      ["Flexion à l’ELU", [
        ["Moment réduit μ", "MEd / (b · d² · fcd)", nf(r.mu, 3), ""],
        ["Coefficient α", "1,25 (1 − √(1 − 2μ))", nf(r.alpha, 3), ""],
        ["Bras de levier z", "d (1 − 0,4 α)", nf(r.z * 100, 2), "cm"],
        ["Section d’acier nécessaire Ast", "MEd / (z · fyd)", nf(r.Ast, 2), "cm²/ml"],
      ]],
      ["Flèche à l’ELS (quasi-permanent)", [
        ["Charge de l’acrotère et du garde-corps", "Pacro / 1,35", nf(r.pels * 100, 1), "daN/ml"],
        ["Charge d’exploitation équivalente", "Q + Ma / (Lu² / 2)", nf(r.Q_alt * 100, 0), "daN/m²"],
        ["Charge quasi-permanente w", "max(G + ψ2 · Q équivalente ; G)", nf(r.wels * 100, 0), "daN/m²"],
        ["Moment quasi-permanent", "P · Lu + w · Lu² / 2", nf(r.Mqp_iso * 100, 0), "daN.m"],
        ["Résistance moyenne en traction fctm", "0,3 · fck^(2/3)", nf(r.fctm, 2), "MPa"],
        ["Module du béton Ecm", "22 · ((fck + 8) / 10)^0,3 · 1000", nf(r.ecm_bet, 0), "MPa"],
        ["Module effectif (fluage) Ec,eff", "Ecm / 3", nf(r.e_bet, 0), "MPa"],
        ["Coefficient d’équivalence αe", "200 000 / Ec,eff", nf(r.alpha_qp, 2), ""],
        ["Position de l’axe neutre, section non fissurée", "", nf(r.xser_1 * 100, 2), "cm"],
        ["Inertie de la section non fissurée", "", nf(r.inertie_un * 1e8, 0), "cm⁴/ml"],
        ["Position de l’axe neutre, section fissurée", "", nf(r.xser_2 * 100, 2), "cm"],
        ["Inertie de la section fissurée", "", nf(r.inertie_deux * 1e8, 0), "cm⁴/ml"],
        ["Moment de fissuration Mcr", "fctm · I non fissurée / (Ha − x)", nf(r.Mcr_MN * 1e5, 0), "daN.m"],
        ["Coefficient de répartition ζ", "0 si Mcr > M quasi-permanent, sinon 1 − (Mcr / M)²", nf(r.delta, 3), ""],
        ["Flèche section non fissurée f1", "", nf(r.f1_iso * 1000, 2), "mm"],
        ["Flèche section fissurée f2", "", nf(r.f2_iso * 1000, 2), "mm"],
      ]],
    ];
    cible.innerHTML = groupes.map(([titre, lignes]) => `
      <div class="groupe">
        <h3>${titre}</h3>
        ${lignes.map(([nom, formule, valeur, unite]) => `
          <div class="ligne-inter">
            <div><span class="li-nom">${nom}</span>${formule ? `<span class="li-formule">${formule}</span>` : ""}</div>
            <span class="li-val">${valeur}${unite ? ` <small>${unite}</small>` : ""}</span>
          </div>`).join("")}
      </div>`).join("");
  }

  function afficherErreurs(erreurs) {
    const items = erreurs.map((e) => `<li>${e.champ.libelle} : ${e.msg}</li>`).join("");
    zoneResultats.innerHTML = `<h2>Résultats</h2>
      <div class="message erreur">Données à corriger :<ul>${items}</ul></div>`;
    majPilule("pil-acier", null);
    majPilule("pil-fleche", null);
    afficherIntermediaires(null);
  }

  function afficherResultats(r, donnees) {
    if (!r.ok) {
      zoneResultats.innerHTML = `<h2>Résultats</h2><div class="message erreur">${r.erreur}</div>`;
      majPilule("pil-acier", null);
      majPilule("pil-fleche", null);
      afficherIntermediaires(null);
      return;
    }
    afficherIntermediaires(r, donnees);
    const alertes = r.avertissements.map((t) => `<div class="message alerte">${t}</div>`).join("");
    zoneResultats.innerHTML = `
      <h2>Résultats</h2>
      ${alertes}
      <div class="groupe">
        <h3>Aciers</h3>
        <div class="ligne-res"><span>Ast nécessaire</span><span class="v">${formater(r.Ast)} cm²/ml</span></div>
        <div class="ligne-res"><span>As réel</span><span class="v">${formater(r.As)} cm²/ml</span></div>
        ${jauge("Taux d’utilisation des aciers", r.taux_utilisation)}
      </div>
      <div class="groupe">
        <h3>Flèche</h3>
        <div class="ligne-res"><span>Flèche réelle</span><span class="v">${formater(r.F_reel)} mm</span></div>
        <div class="ligne-res"><span>Flèche limite</span><span class="v">${formater(r.F_limite)} mm</span></div>
        ${jauge("Taux d’utilisation de la flèche", r.taux_fleche * 100)}
      </div>`;
    majPilule("pil-acier", r.taux_utilisation);
    majPilule("pil-fleche", r.taux_fleche * 100);
  }

  function mettreAJour() {
    const donnees = {};
    const erreurs = [];
    Object.values(champsParCle).forEach((champ) => {
      const input = document.getElementById("f-" + champ.cle);
      const valeur = lireNombre(input.value);
      const msg = verifierChamp(champ, valeur);
      const bloc = input.closest(".champ-bloc");
      bloc.classList.toggle("invalide", msg !== null);
      bloc.querySelector(".msg-champ").textContent = msg ? msg.charAt(0).toUpperCase() + msg.slice(1) + "." : "";
      if (msg) erreurs.push({ champ, msg });
      donnees[champ.cle] = valeur === null ? null : versSI(champ, valeur); // cm -> m, daN -> kN
    });

    document.getElementById("psi").textContent = "ψ2 = " + virgule(PSI2_VALUES[selectType.value]);
    redessinerCoupe();
    // Si un message d'erreur d'export était affiché et que la géométrie est redevenue valide, on l'efface
    if (aideExport.classList.contains("erreur") && lireGeometrie().toutValide) {
      messageExport(texteAideInitial, false);
    }

    if (erreurs.length > 0) { afficherErreurs(erreurs); return; }

    donnees.Limite_fleche = Number(formulaire.elements["limite"].value);
    donnees.psy_deux = PSI2_VALUES[selectType.value];
    afficherResultats(calculer(donnees), donnees);
  }

  let planifie = false;
  function planifier() {
    if (planifie) return;
    planifie = true;
    requestAnimationFrame(() => { planifie = false; mettreAJour(); });
  }

  formulaire.addEventListener("input", planifier);
  formulaire.addEventListener("change", planifier);

  // Sélectionne tout le contenu au toucher d'un champ : on tape directement la nouvelle valeur
  formulaire.addEventListener("focusin", (e) => {
    const cle = e.target.dataset && e.target.dataset.cle;
    if (e.target.tagName === "INPUT" && cle) {
      setTimeout(() => e.target.select(), 0);
      if (CLES_GEOMETRIE.includes(cle)) { champActif = cle; redessinerCoupe(); }
    }
  });
  formulaire.addEventListener("focusout", (e) => {
    if (champActif && e.target.dataset && e.target.dataset.cle === champActif) {
      champActif = null; redessinerCoupe();
    }
  });

  // Touche sur le résumé du bas : défile jusqu'aux résultats
  document.querySelectorAll(".pilule").forEach((p) =>
    p.addEventListener("click", () => zoneResultats.scrollIntoView({ behavior: "smooth", block: "start" })));

  mettreAJour();

  // ---------- Installation / fonctionnement hors ligne ----------
  if ("serviceWorker" in navigator) {
    const avaitUnControleur = !!navigator.serviceWorker.controller;
    let recharge = false;
    // Quand une nouvelle version de l'app prend le relais, on recharge la page une fois
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (avaitUnControleur && !recharge) { recharge = true; location.reload(); }
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
