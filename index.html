<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Balcon EC2</title>

  <!-- Réglages pour que l'app se comporte comme une vraie app sur iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Balcon EC2">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    :root {
      --fond: #f2f3f5;
      --carte: #ffffff;
      --texte: #1b1f24;
      --texte-doux: #5b6572;
      --bordure: #d4d8de;
      --accent: #1f3a5f;
      --accent-texte: #ffffff;
      --ok: #1a7f37;
      --ok-fond: #e3f4e8;
      --ko: #b42318;
      --ko-fond: #fde8e6;
      --alerte-fond: #fff4d6;
      --alerte: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #111418;
        --carte: #1c2128;
        --texte: #e8ebef;
        --texte-doux: #9aa5b1;
        --bordure: #343c46;
        --accent: #4f83c7;
        --accent-texte: #ffffff;
        --ok: #4cc26b;
        --ok-fond: #14301d;
        --ko: #ff7b72;
        --ko-fond: #3a1815;
        --alerte-fond: #3a2e0d;
        --alerte: #f0c060;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.35;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)) 16px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 20px 0 4px; }
    .sous-titre { color: var(--texte-doux); margin: 0 0 16px; font-size: 15px; }
    section {
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 14px;
      padding: 14px 16px 6px;
      margin-bottom: 14px;
    }
    section h2 { font-size: 17px; margin: 0 0 10px; color: var(--accent); }
    label { display: block; font-size: 15px; color: var(--texte-doux); margin: 0 0 4px; }
    .champ { margin-bottom: 12px; }
    input, select {
      width: 100%;
      font-size: 18px; /* 16px minimum : évite le zoom automatique d'iOS */
      padding: 10px 12px;
      border: 1px solid var(--bordure);
      border-radius: 10px;
      background: var(--fond);
      color: var(--texte);
      -webkit-appearance: none;
      appearance: none;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, var(--texte-doux) 50%),
                        linear-gradient(135deg, var(--texte-doux) 50%, transparent 50%);
      background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 36px;
    }
    input.invalide { border-color: var(--ko); background: var(--ko-fond); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%;
      font-size: 18px;
      font-weight: 600;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-texte);
      margin-bottom: 14px;
    }
    button:active { opacity: 0.85; }
    #resultats { scroll-margin-top: 12px; }
    .message {
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .message.erreur { background: var(--ko-fond); color: var(--ko); }
    .message.alerte { background: var(--alerte-fond); color: var(--alerte); }
    .ligne {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 8px 0; border-bottom: 1px solid var(--bordure);
    }
    .ligne:last-child { border-bottom: 0; }
    .ligne .valeur { font-weight: 600; text-align: right; white-space: nowrap; }
    .taux {
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 10px; padding: 10px 12px; margin: 6px 0 10px; font-weight: 600;
    }
    .taux span:last-child { white-space: nowrap; }
    .taux.ok { background: var(--ok-fond); color: var(--ok); }
    .taux.ko { background: var(--ko-fond); color: var(--ko); }
    .titre-bloc { margin: 12px 0 2px; font-weight: 600; }
    .note { color: var(--texte-doux); font-size: 13px; margin: 10px 0 6px; }
  </style>
</head>
<body>
<main>
  <h1>Balcon EC2</h1>
  <p class="sous-titre">Balcon en console : flexion (ELU) et flèche (ELS)</p>

  <form id="formulaire" novalidate autocomplete="off">

    <section>
      <h2>Géométrie</h2>
      <div class="champ"><label for="A">Épaisseur du mur de façade [m]</label>
        <input id="A" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="Ha">Épaisseur du balcon [m]</label>
        <input id="Ha" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="L">Portée totale du balcon [m]</label>
        <input id="L" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="B">Largeur d’acrotère [m]</label>
        <input id="B" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="Hb">Hauteur d’acrotère au-dessus du plancher [m]</label>
        <input id="Hb" inputmode="decimal" type="text"></div>
    </section>

    <section>
      <h2>Matériaux</h2>
      <div class="champ"><label for="fyk">Nuance d’acier fyk [MPa]</label>
        <input id="fyk" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="fck">Résistance du béton fck [MPa]</label>
        <input id="fck" inputmode="decimal" type="text"></div>
    </section>

    <section>
      <h2>Armatures</h2>
      <div class="champ"><label for="e">Enrobage des aciers porteurs [cm]</label>
        <input id="e" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="phi">Diamètre des aciers porteurs [mm]</label>
        <input id="phi" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="As">As réel [cm²/ml]</label>
        <input id="As" inputmode="decimal" type="text"></div>
    </section>

    <section>
      <h2>Chargement</h2>
      <div class="champ"><label for="Gprim">Charge permanente [kN/m²]</label>
        <input id="Gprim" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="Q">Charge d’exploitation [kN/m²]</label>
        <input id="Q" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="PGC">Poids d’un garde-corps [kN/ml]</label>
        <input id="PGC" inputmode="decimal" type="text"></div>
      <div class="champ"><label for="Ma">Moment à l’ancrage [kN.m]</label>
        <input id="Ma" inputmode="decimal" type="text"></div>
    </section>

    <section>
      <h2>Flèche et exploitation</h2>
      <div class="champ"><label for="Limite_fleche">Limite de flèche : L /</label>
        <select id="Limite_fleche">
          <option value="250" selected>250</option>
          <option value="500">500</option>
        </select></div>
      <div class="champ"><label for="type_exploitation">Type d’exploitation principal</label>
        <select id="type_exploitation"></select></div>
    </section>

    <button type="submit">Calculer</button>
  </form>

  <section id="resultats" hidden aria-live="polite"></section>
</main>

<script src="calcul.js"></script>
<script>
  // ---------- Remplissage initial du formulaire ----------
  const CHAMPS_NOMBRES = Object.keys(DEFAULTS);

  for (const nom of CHAMPS_NOMBRES) {
    // Affichage avec une virgule, comme on l'écrit en français
    document.getElementById(nom).value = String(DEFAULTS[nom]).replace(".", ",");
  }

  const selectType = document.getElementById("type_exploitation");
  for (const nom of Object.keys(PSI2_VALUES)) {
    const option = document.createElement("option");
    option.value = nom;
    option.textContent = nom;
    selectType.appendChild(option);
  }

  // ---------- Lecture d'un nombre (accepte la virgule ou le point) ----------
  function lireNombre(texte) {
    const propre = texte.trim().replace(",", ".");
    if (propre === "" || isNaN(Number(propre))) return null;
    return Number(propre);
  }

  function formater(x, decimales = 2) {
    return x.toFixed(decimales).replace(".", ",");
  }

  // ---------- Calcul au clic sur le bouton ----------
  const zoneResultats = document.getElementById("resultats");

  document.getElementById("formulaire").addEventListener("submit", (evenement) => {
    evenement.preventDefault();

    const donnees = {};
    const manquants = [];
    for (const nom of CHAMPS_NOMBRES) {
      const champ = document.getElementById(nom);
      const valeur = lireNombre(champ.value);
      champ.classList.toggle("invalide", valeur === null);
      if (valeur === null) manquants.push(nom);
      donnees[nom] = valeur;
    }

    if (manquants.length > 0) {
      afficherErreur("Certains champs sont vides ou invalides (en rouge). Corrigez-les puis relancez le calcul.");
      return;
    }

    donnees.Limite_fleche = Number(document.getElementById("Limite_fleche").value);
    donnees.psy_deux = PSI2_VALUES[selectType.value];

    afficherResultats(calculer(donnees));
  });

  // ---------- Affichage ----------
  function afficherErreur(texte) {
    zoneResultats.innerHTML = "";
    const div = document.createElement("div");
    div.className = "message erreur";
    div.textContent = texte;
    zoneResultats.appendChild(div);
    montrer();
  }

  function afficherResultats(r) {
    if (!r.ok) { afficherErreur(r.erreur); return; }

    let html = "<h2>Résultats</h2>";

    for (const texte of r.avertissements) {
      html += `<div class="message alerte">${texte}</div>`;
    }

    html += `<div class="titre-bloc">Aciers</div>
      <div class="ligne"><span>Ast nécessaire</span><span class="valeur">${formater(r.Ast)} cm²/ml</span></div>
      <div class="ligne"><span>As réel</span><span class="valeur">${formater(r.As)} cm²/ml</span></div>
      <div class="taux ${r.taux_utilisation <= 100 ? "ok" : "ko"}">
        <span>Taux d’utilisation des aciers</span><span>${formater(r.taux_utilisation)} %</span></div>

      <div class="titre-bloc">Flèche</div>
      <div class="ligne"><span>Flèche réelle</span><span class="valeur">${formater(r.F_reel)} mm</span></div>
      <div class="ligne"><span>Flèche limite</span><span class="valeur">${formater(r.F_limite)} mm</span></div>
      <div class="taux ${r.taux_fleche <= 1 ? "ok" : "ko"}">
        <span>Taux d’utilisation de la flèche</span><span>${formater(r.taux_fleche * 100)} %</span></div>`;

    zoneResultats.innerHTML = html;
    montrer();
  }

  function montrer() {
    zoneResultats.hidden = false;
    zoneResultats.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---------- Installation / fonctionnement hors ligne ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
